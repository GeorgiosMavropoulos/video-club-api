<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
     <!---Bootstrap cdn link!-->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

 <!--bootstrap bundle for extra functionality!-->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


 <!--bootstrap icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
     <title>Dvd Escape-Movie Update</title>
</head>
 <body>
    <!--header class-->
<header class ="header-section text-white text-center py-3">
<div class="container"> 
            <h1 class="display-4 fw-bold mb-0">THE DVD ESCAPE 🎬</h1>
        </div>
</head> 
</header>



<!--Creating the gallery section-->
<section class ="gallery-section py-4">
    <div class ="container">
        <div class="row mb-4">
    <div class="col-12">
 <div id="back_to_movie_gallery">
    
 </div>
</div>

 <!-- search bar -->
   <div class="row justify-content-center mt-2 mb-3">
   <div class="col-md-6">
   <div class="input-group">
   <input type="text" class="form-control" id="searchInput" placeholder="Search movie">
    <button class="btn btn-primary" id="searchBtn">
    <i class="bi bi-search"></i> Search
     </button>
    </div>
    </div>
       <!--creating a button which will pop up a modal window to enable user add new category!-->
            <div class="text-center d-flex justify-content-center mt-2 " >
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_category_modal_window">
            Add new category
            </button>

            </div>

               <!---Creating a btn which will pop a modal window enabling user to delete a desired category!-->
               <div class="text-center d-flex justify-content-center mt-2 " >
            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#delete_category_modal_window">
            Delete category
            </button>

            </div>
    <!--Add new movie button-->
   <div class="col-md-2 mt-2  text-end">
<div id="add_movie_page_btn">
    
</div>
                            
   </div>
   
  </div>
  </div>
     </div>

    </div>
<!-- categories ! -->
       <div class="row mb-4">
      <div class="col-12">
        <div id ="category_container" class="btn-group d-flex flex-wrap justify-content-center gap-2">

    </div>
    </div>
            </div>


            <div class ="container mt-5">
            <h1 class="text-center mb-4f text-white fw-bold">Add New Movie</h1>
                  
             <div id="input-form"><!---this form will enable user to input a new movie-->
                <div id="add_movie">
                      <!--creating the form!-->
                <form id = "add_movie_form" class="mx-auto" style="max-width: 500px;">

                        <!--category id!-->
               <div class = "mb-3">
               <label for="category_id" class="form-label fw-semibold">Category id</label>
               <select id = "category_id"required>
                <option value="1">Comedy</option>
                <option value="2">Drama</option>
                <option value = "3">Action</option>
                <option value ="4">Horror</option>
                <option value = "5">Crime</option>
                <option value = "6">Documentary</option>
                </select>
            </div>


                <!--image input-->
                <!--Upload image's url since the API accepts only image url-->
               <div class ="mb-3">
                <label for="image"class="form-label fw-semibold">Upload Image Path<i class="bi bi-info-circle ms-2 text-white"
       role="button"
       data-bs-toggle="modal"
       id="imgHelpBtn"
       data-bs-target="#imageHelpModal"  style="color: #ffffff; cursor: pointer;">INFO ON HOW TO UPLOAD AN IMAGE</i></label>
                <input type="text" class="form-control" id="image" placeholder="example:/uploads/movie.jpeg" required>

               </div>

              
               <!--title-->
               <div class = "mb-3">
               <label for="title" class="form-label fw-semibold">Title</label>
               <input type="text" class="form-control" id="title" placeholder="Enter movie's title" required>
            </div>

            <!--director-->
            <div class = "mb-3">
                <label for="director" class="form-label fw-semibold">Director</label>
                <input type="text" class="form-control" id="director" placeholder="Enter director's name" required>
            </div>

             <!--release date-->
            <div class = "mb-3">
                <label for="date" class="form-label fw-semibold">Release date</label>
                <input type="text" class="form-control" id="date" placeholder="Enter release date" required>
            </div>

            <!--plot-->
            <div class ="mb-3">
                <label for="plot" class="form-label fw-semibold">Plot</label>
             <textarea class="form-control" id="plot" rows="3" placeholder="Movie description" required></textarea>
            </div>
          <!--genre-->
            <div class = "mb-3">
                <label for="genre" class="form-label fw-semibold">Genre</label>
                <input type="text" class="form-control" id="genre" placeholder="Enter movie's genre" required>
            </div>

            <!--Add movie btn-->
                <div class="d-grid gap-2 mt-4">
                <button  type="button"  class="btn btn-primary" onclick="add_movie()">
                    <i class="bi bi-check-circle"></i> Add movie
          
                </button>

                </div>

                
                


                </form>

                </div>

</div>
</div>

<!---Adding a new add category modal!-->
<div class="modal fade" id="add_category_modal_window" tabindex="-1" aria-labelledby="addCategoryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!--header-->
            <div class="modal-header">
                <h5 class="modal-title" id="addCategoryLabel">Add new category</h5>
                
            <!--body-->
            <div class="modal-body">
                <form id="add_category_form">
                <div class ="mb-3">
                <label for="category_name" class="form-label">Category Name</label>
                <input type="text" class="form-control" id="categoryName" placeholder="Enter category's name" required>

                <!--footer with btns!-->
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="add_category()">Add</button>
                
                </div>

                </div>
                </form>
            </div>

            </div>
        </div>
    </div>


</div>

<!---Adding delete category modal!-->
<div class="modal fade" id="delete_category_modal_window"  tabindex="-1" aria-labelledby="deleteCategoryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!--header-->
            <div class="modal-header">
                <h5 class="modal-title text-danger" id="deleteCategoryLabel">Delete category</h5>
               
            <!--body-->
            <div class="modal-body">
                <form id="delete_category_form">
                <div class ="mb-3">
                <label for="category_name" class="form-label">Category Name</label>
                <input type="text" class="form-control" id="category_name_to_delete" placeholder="Enter category name to delete" required>

                <!--footer with btns!-->
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="delete_category()">Delete</button>
                
                </div>

                </div>
                </form>
            </div>

            </div>
        </div>
    </div>


</div>

<script src="app.js"></script> <!---Access to the JS file!--->

<!---Script to display the modal which guides user regarding image uploading!-->
<script>
    //getting the element !
document.getElementById('imgHelpBtn').addEventListener('click',()=>{
//creating the modal container
const modalContainer = document.createElement('div');


 //creating the html code for the modalContainer!
 modalContainer.innerHTML=
 `
  <div class ="modal fade" id="dynamicModal" bg-primary tabindex="-1" aria-hidden = "true">
   <div class="modal-dialog modal-dialog-centered">
     <div class="modal-content">
        <div class="modal-header">
         <h5 class="modal-title">How to Upload the Movie Image</h5>
         <button class ="btn-close" type="button" data-bs-dismiss="modal"></button>    
            
            </div>
            <div class = "modal-body">
            <ol>
            <li>Download and save movie's image inside the <code>/uploads</code> folder. You will find the uploads folder inside the API folder which location is in the folder cet252</li>
            <li>Use jpeg format</li>
            <li>the image path is /uploads/myimage.jpeg</li>
          
                </ol>
                </div>
                  <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
            </div>
    </div>
    </div>
 `;

 //appending to body!
 document.body.appendChild(modalContainer);

 //initialising modal!
 const modal = new bootstrap.Modal(document.getElementById('dynamicModal'));
 modal.show();//displaying the modal
});


</script>
</html>
